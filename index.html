<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>香港 PS5 Slim 數位版每日現貨及升帳監察</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f4f6f9; color: #1f2937; margin: 0; padding: 20px; }
    .container { max-width: 960px; margin: 0 auto; background: #fff; border-radius: 12px; box-shadow: 0 4px 16px rgba(0,0,0,0.06); padding: 24px; }
    h1 { font-size: 1.4rem; margin: 0 0 8px; color: #111827; }
    .meta { font-size: 0.9rem; color: #6b7280; margin-bottom: 20px; display: flex; flex-wrap: wrap; gap: 16px; }
    .badge-msrp { background: #e0f2fe; color: #0369a1; padding: 2px 8px; border-radius: 6px; font-weight: 600; }
    table { width: 100%; border-collapse: collapse; font-size: 0.95rem; }
    th, td { padding: 14px 12px; text-align: left; border-bottom: 1px solid #e5e7eb; }
    th { background: #f9fafb; font-weight: 600; color: #374151; }
    .in-stock { color: #059669; font-weight: 700; }
    .out-stock { color: #9ca3af; }
    .up { color: #dc2626; font-weight: 600; }
    .down { color: #059669; font-weight: 600; }
    .flat { color: #6b7280; }
    a.btn { display: inline-block; padding: 6px 12px; background: #2563eb; color: #fff; text-decoration: none; border-radius: 6px; font-size: 0.85rem; }
    a.btn:hover { background: #1d4ed8; }
    @media (max-width: 640px) { th, td { padding: 10px 6px; font-size: 0.85rem; } }
  </style>
</head>
<body>
  <div class="container">
    <h1>🎮 香港 PS5 Slim 數位版 (CFI-2118B01) 每日現貨監察</h1>
    <div class="meta">
      <span>最後更新：<strong id="updated-at">載入中...</strong> (香港時間)</span>
      <span class="badge-msrp">官方建議零售價：HK$4,257</span>
    </div>
    <table>
      <thead>
        <tr>
          <th>商戶 / 渠道</th>
          <th>真實庫存狀態</th>
          <th>目前標價</th>
          <th>相對官價 (升帳)</th>
          <th>較昨日變動</th>
          <th>直達連結</th>
        </tr>
      </thead>
      <tbody id="table-body">
        <tr><td colspan="6">正在讀取最新數據...</td></tr>
      </tbody>
    </table>
  </div>

  <script>
    fetch('data.json?t=' + Date.now())
      .then(res => res.json())
      .then(data => {
        document.getElementById('updated-at').textContent = data.updated_at;
        const tbody = document.getElementById('table-body');
        tbody.innerHTML = '';

        data.items.forEach(item => {
          const priceStr = item.price ? `HK$${item.price.toLocaleString()}` : '未顯示';
          
          let premStr = '-';
          let premClass = 'flat';
          if (item.premium !== null) {
            if (item.premium > 0) { premStr = `+HK$${item.premium} (炒價/套裝)`; premClass = 'up'; }
            else if (item.premium < 0) { premStr = `-HK$${Math.abs(item.premium)} (低於官價)`; premClass = 'down'; }
            else { premStr = 'HK$0 (正價)'; }
          }

          let diffStr = '無變動';
          let diffClass = 'flat';
          if (item.daily_diff > 0) { diffStr = `▲ +HK$${item.daily_diff}`; diffClass = 'up'; }
          else if (item.daily_diff < 0) { diffStr = `▼ -HK$${Math.abs(item.daily_diff)}`; diffClass = 'down'; }

          const tr = document.createElement('tr');
          tr.innerHTML = `
            <td><strong>${item.store}</strong><br><small style="color:#6b7280">${item.type}</small></td>
            <td class="${item.is_available ? 'in-stock' : 'out-stock'}">${item.status}</td>
            <td><strong>${priceStr}</strong></td>
            <td class="${premClass}">${premStr}</td>
            <td class="${diffClass}">${diffStr}</td>
            <td><a class="btn" href="${item.url}" target="_blank">前往查看</a></td>
          `;
          tbody.appendChild(tr);
        });
      })
      .catch(() => {
        document.getElementById('table-body').innerHTML = '<tr><td colspan="6">尚未產生數據，請先在 GitHub Actions 執行一次工作流。</td></tr>';
      });
  </script>
</body>
</html>
