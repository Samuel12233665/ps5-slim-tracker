<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>香港 PS5 Slim 數位版每日現貨及升帳監察</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f4f6f9; color: #1f2937; margin: 0; padding: 20px; }
    .container { max-width: 960px; margin: 0 auto; background: #fff; border-radius: 12px; box-shadow: 0 4px 16px rgba(0,0,0,0.06); padding: 24px; }
    .top-bar { display: flex; justify-content: space-between; align-items: flex-start; flex-wrap: wrap; gap: 12px; margin-bottom: 12px; }
    h1 { font-size: 1.4rem; margin: 0 0 8px; color: #111827; }
    .meta { font-size: 0.9rem; color: #6b7280; margin-bottom: 16px; display: flex; flex-wrap: wrap; gap: 16px; align-items: center; }
    .badge-msrp { background: #e0f2fe; color: #0369a1; padding: 2px 8px; border-radius: 6px; font-weight: 600; }
    .btn-group { display: flex; gap: 8px; align-items: center; }
    .refresh-btn { padding: 10px 16px; background: #059669; color: #fff; border: none; border-radius: 8px; font-size: 0.92rem; font-weight: 600; cursor: pointer; }
    .refresh-btn:hover:not(:disabled) { background: #047857; }
    .refresh-btn:disabled { background: #9ca3af; cursor: not-allowed; }
    .token-btn { padding: 10px 12px; background: #f3f4f6; color: #374151; border: 1px solid #d1d5db; border-radius: 8px; font-size: 0.85rem; cursor: pointer; }
    .token-btn:hover { background: #e5e7eb; }
    .status-msg { font-size: 0.88rem; color: #374151; background: #f9fafb; border: 1px solid #e5e7eb; padding: 10px 14px; border-radius: 8px; margin-bottom: 16px; display: none; }
    table { width: 100%; border-collapse: collapse; font-size: 0.95rem; }
    th, td { padding: 14px 12px; text-align: left; border-bottom: 1px solid #e5e7eb; }
    th { background: #f9fafb; font-weight: 600; color: #374151; }
    .in-stock { color: #059669; font-weight: 700; }
    .out-stock { color: #9ca3af; }
    .up { color: #dc2626; font-weight: 600; }
    .down { color: #059669; font-weight: 600; }
    .flat { color: #6b7280; }
    a.btn { display: inline-block; padding: 6px 12px; background: #2563eb; color: #fff; text-decoration: none; border-radius: 6px; font-size: 0.85rem; }
    a.btn:hover { background: #1d4ed8; }
    @media (max-width: 640px) { th, td { padding: 10px 6px; font-size: 0.85rem; } }
  </style>
</head>
<body>
  <div class="container">
    <div class="top-bar">
      <div>
        <h1>🎮 香港 PS5 Slim 數位版 (CFI-2118B01) 現貨監察</h1>
        <div class="meta">
          <span>最後更新：<strong id="updated-at">載入中...</strong> (香港時間)</span>
          <span class="badge-msrp">官方建議零售價：HK$4,257</span>
        </div>
      </div>
      <div class="btn-group">
        <button id="refreshBtn" class="refresh-btn" onclick="triggerRefresh()">🔄 立即重新查價</button>
        <button class="token-btn" onclick="resetToken()" title="重設本機儲存的 GitHub Token">🔑 重設 Token</button>
      </div>
    </div>

    <div id="statusMsg" class="status-msg"></div>

    <table>
      <thead>
        <tr>
          <th>商戶 / 渠道</th>
          <th>真實庫存狀態</th>
          <th>目前標價</th>
          <th>相對官價 (升帳)</th>
          <th>較昨日變動</th>
          <th>直達連結</th>
        </tr>
      </thead>
      <tbody id="table-body">
        <tr><td colspan="6">正在讀取最新數據...</td></tr>
      </tbody>
    </table>
  </div>

  <script>
    const OWNER = "Samuel12233665";
    const REPO = "ps5-slim-tracker";
    const WORKFLOW_FILE = "daily.yml";
    const STORAGE_KEY = "ps5_tracker_gh_token";

    function getToken() {
      let token = localStorage.getItem(STORAGE_KEY);
      if (!token) {
        token = prompt("請貼上你的 GitHub Fine-grained Token（只會儲存在你目前瀏覽器本機，不會上傳至公開網頁）：");
        if (token && token.trim()) {
          localStorage.setItem(STORAGE_KEY, token.trim());
          return token.trim();
        }
        return null;
      }
      return token;
    }

    function resetToken() {
      localStorage.removeItem(STORAGE_KEY);
      alert("已清除本機儲存的 Token，下次點擊「立即重新查價」時可重新貼上。");
    }

    function loadTable() {
      fetch('data.json?t=' + Date.now())
        .then(res => res.json())
        .then(data => {
          document.getElementById('updated-at').textContent = data.updated_at;
          const tbody = document.getElementById('table-body');
          tbody.innerHTML = '';

          data.items.forEach(item => {
            const priceStr = item.price ? `HK$${item.price.toLocaleString()}` : '未顯示';

            let premStr = '-';
            let premClass = 'flat';
            if (item.premium !== null) {
              if (item.premium > 0) { premStr = `+HK$${item.premium} (炒價/套裝)`; premClass = 'up'; }
              else if (item.premium < 0) { premStr = `-HK$${Math.abs(item.premium)} (低於官價)`; premClass = 'down'; }
              else { premStr = 'HK$0 (正價)'; }
            }

            let diffStr = '無變動';
            let diffClass = 'flat';
            if (item.daily_diff > 0) { diffStr = `▲ +HK$${item.daily_diff}`; diffClass = 'up'; }
            else if (item.daily_diff < 0) { diffStr = `▼ -HK$${Math.abs(item.daily_diff)}`; diffClass = 'down'; }

            const tr = document.createElement('tr');
            tr.innerHTML = `
              <td><strong>${item.store}</strong><br><small style="color:#6b7280">${item.type}</small></td>
              <td class="${item.is_available ? 'in-stock' : 'out-stock'}">${item.status}</td>
              <td><strong>${priceStr}</strong></td>
              <td class="${premClass}">${premStr}</td>
              <td class="${diffClass}">${diffStr}</td>
              <td><a class="btn" href="${item.url}" target="_blank">前往查看</a></td>
            `;
            tbody.appendChild(tr);
          });
        })
        .catch(() => {
          document.getElementById('table-body').innerHTML = '<tr><td colspan="6">尚未產生數據，請按「立即重新查價」或先在 GitHub Actions 執行一次。</td></tr>';
        });
    }

    async function triggerRefresh() {
      const btn = document.getElementById('refreshBtn');
      const msg = document.getElementById('statusMsg');
      const token = getToken();

      if (!token) {
        msg.style.display = 'block';
        msg.textContent = '⚠️ 未輸入 Token，已取消操作。';
        return;
      }

      btn.disabled = true;
      btn.textContent = '⏳ 正在啟動雲端查價...';
      msg.style.display = 'block';
      msg.textContent = '已送出指令，GitHub 雲端正在抓取各店最新價格與庫存（約需 30～60 秒），完成後將自動刷新表格...';

      try {
        const resp = await fetch(`https://api.github.com/repos/${OWNER}/${REPO}/actions/workflows/${WORKFLOW_FILE}/dispatches`, {
          method: "POST",
          headers: {
            "Authorization": `Bearer ${token}`,
            "Accept": "application/vnd.github+json",
            "Content-Type": "application/json"
          },
          body: JSON.stringify({ ref: "main" })
        });

        if (!resp.ok) {
          if (resp.status === 401 || resp.status === 403) {
            localStorage.removeItem(STORAGE_KEY);
          }
          throw new Error(`API 回應狀態 ${resp.status}`);
        }

        const oldUpdated = document.getElementById('updated-at').textContent;
        let checks = 0;
        const timer = setInterval(async () => {
          checks++;
          try {
            const res = await fetch('data.json?t=' + Date.now());
            const latest = await res.json();
            if (latest.updated_at && latest.updated_at !== oldUpdated) {
              clearInterval(timer);
              loadTable();
              btn.disabled = false;
              btn.textContent = '🔄 立即重新查價';
              msg.textContent = `✅ 已更新至最新時間：${latest.updated_at}`;
              return;
            }
          } catch (_) {}

          if (checks >= 24) {
            clearInterval(timer);
            loadTable();
            btn.disabled = false;
            btn.textContent = '🔄 立即重新查價';
            msg.textContent = '查價仍在背景進行中，請稍後再按一次或重新整理頁面查看。';
          }
        }, 5000);
      } catch (err) {
        btn.disabled = false;
        btn.textContent = '🔄 立即重新查價';
        msg.textContent = `❌ 觸發失敗（${err.message}），請檢查 Token 是否有效或重新產生一組。`;
      }
    }

    loadTable();
  </script>
</body>
</html>
